<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Catalog Hub</title>
    <meta name="description" content="A beautiful and modern platform to manage, search, and download course documents.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="app-container">
        <header class="top-nav">
            <div class="logo-area">
                <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <h1>CourseHub</h1>
            </div>
            
            <div class="search-container">
                <i class="fa-solid fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search by course code or name..." autocomplete="off">
            </div>

            <div class="actions-area">
                <button id="addCourseBtn" class="primary-btn">
                    <i class="fa-solid fa-plus"></i> Add Course
                </button>
            </div>
        </header>

        <main class="main-content">
            <div class="content-header">
                <h2>Available Courses</h2>
                <div class="stats" id="courseStats">Loading...</div>
            </div>

            <div class="courses-grid" id="coursesGrid">
                <!-- Course cards will be generated here by JavaScript -->
            </div>
            
            <div class="empty-state hidden" id="emptyState">
                <i class="fa-solid fa-folder-open"></i>
                <h3>No courses found</h3>
                <p>Try adjusting your search criteria or add a new course.</p>
            </div>
        </main>
    </div>

    <!-- Add Course Modal -->
    <div class="modal-overlay hidden" id="addCourseModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Course</h2>
                <button class="close-btn" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="addCourseForm">
                <div class="form-group">
                    <label for="courseCode">Course Code</label>
                    <input type="text" id="courseCode" required placeholder="e.g. CS101">
                </div>
                <div class="form-group">
                    <label for="courseTitle">Course Title</label>
                    <input type="text" id="courseTitle" required placeholder="e.g. Introduction to Programming">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="semester">Semester</label>
                        <input type="number" id="semester" required min="1" max="10" placeholder="e.g. 1">
                    </div>
                    <div class="form-group">
                        <label for="credits">Credits</label>
                        <input type="number" id="credits" required min="1" max="6" placeholder="e.g. 3">
                    </div>
                </div>
                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" required placeholder="e.g. Computer Science">
                </div>
                <div class="form-actions">
                    <button type="button" class="secondary-btn" id="cancelBtn">Cancel</button>
                    <button type="submit" class="primary-btn">Save Course</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
