<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - GMInsta</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="theme.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #fafafa;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: white;
            border-bottom: 1px solid #dbdbdb;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header i {
            font-size: 24px;
            cursor: pointer;
            margin-right: 16px;
        }

        .search-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: #efefef;
            border-radius: 10px;
            padding: 8px 12px;
        }

        .search-box i {
            margin-right: 8px;
            font-size: 16px;
            color: #8e8e8e;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
        }

        .results-container {
            padding: 8px 0;
        }

        .result-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: background 0.2s;
        }

        .result-item:hover {
            background: #f2f2f2;
        }

        .result-item img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            margin-right: 12px;
            object-fit: cover;
        }

        .result-info {
            flex: 1;
        }

        .result-username {
            font-weight: 600;
            font-size: 14px;
        }

        .result-fullname {
            font-size: 12px;
            color: #8e8e8e;
        }

        .follow-btn {
            background: #0095f6;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        .follow-btn.following {
            background: #efefef;
            color: #262626;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #8e8e8e;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            background: white;
            border-top: 1px solid #dbdbdb;
        }

        .bottom-nav i {
            font-size: 24px;
            color: #262626;
            cursor: pointer;
        }

        body.dark-theme {
            background: #000;
        }

        body.dark-theme .header,
        body.dark-theme .bottom-nav,
        body.dark-theme .result-item {
            background: #000;
            border-color: #262626;
            color: #fff;
        }

        body.dark-theme .search-box {
            background: #262626;
        }

        body.dark-theme .search-box input {
            color: #fff;
        }

        body.dark-theme .result-item:hover {
            background: #1a1a1a;
        }

        body.dark-theme .follow-btn.following {
            background: #262626;
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="header">
        <i class="fa-solid fa-arrow-left" onclick="window.location.href='/'"></i>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search users...">
        </div>
    </div>

    <div class="results-container" id="resultsContainer">
        <div class="no-results">🔍 Search for users by username or name</div>
    </div>

    <div class="bottom-nav">
        <i class="fa-solid fa-house" onclick="location.href='/'"></i>
        <i class="fa-solid fa-magnifying-glass" onclick="location.href='search.html'"></i>
        <i class="fa-regular fa-square-plus" onclick="location.href='post.html'"></i>
        <i class="fa-regular fa-heart" onclick="location.href='notifications.html'"></i>
        <i class="fa-regular fa-user" onclick="location.href='profile.html'"></i>
    </div>

    <script>
        let token = localStorage.getItem('gminsta_token');
        let currentUser = null;
        let searchTimeout = null;

        async function init() {
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            const storedUser = localStorage.getItem('gminsta_currentUser');
            if (storedUser) {
                currentUser = JSON.parse(storedUser);
            } else {
                const userRes = await fetch('/api/users/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                currentUser = await userRes.json();
                localStorage.setItem('gminsta_currentUser', JSON.stringify(currentUser));
            }
        }

        async function searchUsers(query) {
            if (query.length < 2) {
                document.getElementById('resultsContainer').innerHTML = '<div class="no-results">🔍 Type at least 2 characters to search</div>';
                return;
            }

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();

                const container = document.getElementById('resultsContainer');
                
                if (!data.users || data.users.length === 0) {
                    container.innerHTML = '<div class="no-results">😞 No users found</div>';
                    return;
                }

                container.innerHTML = '';
                for (const user of data.users) {
                    const isFollowing = currentUser.following?.includes(user.usn) || false;
                    container.innerHTML += `
                        <div class="result-item" data-usn="${user.usn}">
                            <img src="${user.profilePhoto || `https://ui-avatars.com/api/?name=${user.username}&background=833AB4&color=fff`}">
                            <div class="result-info" onclick="viewProfile('${user.usn}')">
                                <div class="result-username">${user.username}</div>
                                <div class="result-fullname">${user.fullname || ''}</div>
                            </div>
                            <button class="follow-btn ${isFollowing ? 'following' : ''}" onclick="toggleFollow('${user.usn}', this)">
                                ${isFollowing ? 'Following' : 'Follow'}
                            </button>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Search error:', error);
                document.getElementById('resultsContainer').innerHTML = '<div class="no-results">❌ Error searching. Please try again.</div>';
            }
        }

        async function toggleFollow(usn, button) {
            const isFollowing = button.classList.contains('following');
            const method = isFollowing ? 'DELETE' : 'POST';
            
            try {
                const response = await fetch(`/api/users/${usn}/follow`, {
                    method: method,
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (response.ok) {
                    if (isFollowing) {
                        button.classList.remove('following');
                        button.textContent = 'Follow';
                        // Update currentUser
                        currentUser.following = currentUser.following.filter(u => u !== usn);
                    } else {
                        button.classList.add('following');
                        button.textContent = 'Following';
                        currentUser.following.push(usn);
                    }
                    localStorage.setItem('gminsta_currentUser', JSON.stringify(currentUser));
                }
            } catch (error) {
                console.error('Follow error:', error);
            }
        }

        function viewProfile(usn) {
            window.location.href = `user_profile.html?usn=${usn}`;
        }

        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchUsers(e.target.value.trim());
            }, 300);
        });

        init();
    </script>

</body>

</html>
