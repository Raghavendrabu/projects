<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - GMInsta</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="theme.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #fafafa;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: white;
            border-bottom: 1px solid #dbdbdb;
            position: sticky;
            top: 0;
        }

        .header i {
            font-size: 24px;
            cursor: pointer;
            margin-right: 16px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .notification-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #dbdbdb;
            gap: 12px;
            background: white;
        }

        .notification-item.unread {
            background: #f0f0f0;
        }

        .notification-item img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
        }

        .notification-text {
            flex: 1;
            font-size: 14px;
        }

        .notification-text b {
            font-weight: 600;
        }

        .notification-time {
            font-size: 10px;
            color: #8e8e8e;
            margin-top: 4px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            background: white;
            border-top: 1px solid #dbdbdb;
        }

        .bottom-nav i {
            font-size: 24px;
            color: #262626;
            cursor: pointer;
        }

        body.dark-theme .header,
        body.dark-theme .bottom-nav,
        body.dark-theme .notification-item {
            background: #000;
            border-color: #262626;
        }

        body.dark-theme .notification-item.unread {
            background: #1a1a1a;
        }

        body.dark-theme .notification-time {
            color: #8e8e8e;
        }
    </style>
</head>

<body>

    <div class="header">
        <i class="fa-solid fa-arrow-left" onclick="window.location.href='/'"></i>
        <h1>Notifications</h1>
    </div>

    <div id="notificationsContainer">
        <div style="text-align:center; padding:40px; color:#8e8e8e;">Loading notifications...</div>
    </div>

    <div class="bottom-nav">
        <i class="fa-solid fa-house" onclick="location.href='/'"></i>
        <i class="fa-solid fa-magnifying-glass" onclick="location.href='search.html'"></i>
        <i class="fa-regular fa-square-plus" onclick="location.href='post.html'"></i>
        <i class="fa-solid fa-heart" onclick="location.href='notifications.html'" style="color:#ed4956;"></i>
        <i class="fa-regular fa-user" onclick="location.href='profile.html'"></i>
    </div>

    <script>
        let token = localStorage.getItem('gminsta_token');
        let currentUser = null;
        
        if (!token) window.location.href = 'login.html';

        async function loadNotifications() {
            const storedUser = localStorage.getItem('gminsta_currentUser');
            if (storedUser) {
                currentUser = JSON.parse(storedUser);
            }

            const res = await fetch('/api/notifications', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await res.json();
            const container = document.getElementById('notificationsContainer');
            
            if (!data.notifications || data.notifications.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:#8e8e8e;">No notifications yet</div>';
                return;
            }

            const icons = {
                'like': '<i class="fa-solid fa-heart" style="color:#ed4956;"></i>',
                'comment': '<i class="fa-regular fa-comment" style="color:#0095f6;"></i>',
                'follow': '<i class="fa-solid fa-user-plus" style="color:#0095f6;"></i>'
            };

            const messages = {
                'like': 'liked your post',
                'comment': 'commented on your post',
                'follow': 'started following you'
            };

            container.innerHTML = data.notifications.map(n => `
                <div class="notification-item ${!n.is_read ? 'unread' : ''}">
                    <img src="${n.from_avatar || 'https://randomuser.me/api/portraits/lego/1.jpg'}">
                    <div class="notification-text">
                        <b>${n.from_username}</b> ${messages[n.type]} ${icons[n.type]}
                        <div class="notification-time">${n.created_ago || 'Just now'}</div>
                    </div>
                </div>
            `).join('');

            // Mark as read
            await fetch('/api/notifications/mark-all-read', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
        }

        loadNotifications();
    </script>

</body>

</html>
