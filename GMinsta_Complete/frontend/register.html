<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GMInsta</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('assets/reg.bg.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            margin-left: 10%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            color: #fff;
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .auth-container h1 {
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(45deg, #feda75, #d62976, #962fbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-container h2 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .intro-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .auth-container input {
            width: 100%;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .password-container {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .password-container input {
            margin-bottom: 0;
            padding-right: 45px;
        }

        .password-container i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .password-container i:hover {
            color: #fff;
        }

        .auth-container input:focus {
            outline: none;
            border-color: #d62976;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(214, 41, 118, 0.3);
        }

        .auth-container input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .auth-container button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #feda75, #d62976, #962fbf);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .auth-container button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(214, 41, 118, 0.4);
        }

        .auth-container p {
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
        }

        .auth-container a {
            color: #feda75;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .auth-container a:hover {
            color: #fff;
        }

        @media(max-width: 768px) {
            body {
                justify-content: center;
            }

            .auth-container {
                margin-left: 0;
                width: 90%;
                padding: 30px;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <h1>Join.</h1>
        <h2>Register and find your community</h2>
        <p class="intro-text">Create an account to join GMInsta. Follow your friends, share your stories, and discover
            new content every day.</p>
        <form id="registerForm">
            <input type="text" id="fullname" placeholder="Full Name" required>
            <input type="text" id="username" placeholder="Username" required>
            <input type="text" id="usn" placeholder="USN" required>
            <div class="password-container">
                <input type="password" id="password" placeholder="Password" required>
                <i class="fa-solid fa-eye" id="togglePassword"></i>
            </div>
            <button type="submit">Register</button>
        </form>

        <p style="text-align: center;">Already have an account? <a href="login.html">Login</a></p>
    </div>

    <script>
        document.getElementById('togglePassword').addEventListener('click', function (e) {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        document.getElementById('registerForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const fullname = document.getElementById('fullname').value.trim();
            const username = document.getElementById('username').value.trim();
            const usn = document.getElementById('usn').value.trim();
            const password = document.getElementById('password').value.trim();

            if (fullname && username && usn && password) {
                try {
                    const response = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fullname, username, usn, password })
                    });
                    const data = await response.json();

                    if (data.success) {
                        localStorage.setItem('gminsta_token', data.token);
                        localStorage.setItem('gminsta_currentUser', JSON.stringify(data.user));
                        window.location.href = 'setup_photo.html';
                    } else {
                        alert(data.error);
                    }
                } catch (error) {
                    alert('Server error. Make sure backend is running.');
                }
            } else {
                alert('Please fill out all fields');
            }
        });
    </script>
    <footer style="position:fixed; bottom:0; width:100%; background:#000000; text-align:center; padding:10px 0; color:white; font-size:18px; z-index:999;">
        <p style="margin:0;">&copy; 2026 RASHINKAR's Developers and Co pvt.ltd</p>
    </footer>
</body>

</html>
