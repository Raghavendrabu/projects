<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Profile Photo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="theme.js"></script>
    <style>
        body {
            background-image: url('assets/newlogo.jpeg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        body.dark-theme .card {
            background: rgba(30, 30, 30, 0.9);
            color: white;
        }

        .preview-container {
            width: 150px;
            height: 150px;
            margin: 20px auto;
            border-radius: 50%;
            overflow: hidden;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ddd;
        }

        .preview-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .preview-container i {
            font-size: 50px;
            color: #aaa;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background: #0095f6;
            color: white;
        }

        .btn-secondary {
            background: #efefef;
            color: black;
            margin-top: 10px;
        }
        
        body.dark-theme .btn-secondary {
            background: #333;
            color: white;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Add a Profile Photo</h2>
        <p>Add a profile photo so your friends know it's you.</p>

        <label for="fileInput" style="cursor: pointer;">
            <div class="preview-container">
                <i class="fa-solid fa-user" id="defaultIcon"></i>
                <img id="imagePreview" alt="Profile Preview">
            </div>
            <div style="color: #0095f6; font-weight: bold;">Choose Photo</div>
        </label>
        
        <input type="file" id="fileInput" accept="image/*">

        <button class="btn btn-primary" id="saveBtn" style="display: none;">Continue</button>
        <button class="btn btn-secondary" onclick="skip()">Skip for now</button>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');
        const defaultIcon = document.getElementById('defaultIcon');
        const saveBtn = document.getElementById('saveBtn');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let base64Image = null;

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const MAX_SIZE = 400;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        base64Image = canvas.toDataURL('image/jpeg', 0.8);
                        
                        imagePreview.src = base64Image;
                        imagePreview.style.display = 'block';
                        defaultIcon.style.display = 'none';
                        saveBtn.style.display = 'block';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        saveBtn.addEventListener('click', async function() {
            const token = localStorage.getItem('gminsta_token');
            const currentUser = JSON.parse(localStorage.getItem('gminsta_currentUser') || '{}');
            
            if (base64Image && token) {
                await fetch('/api/users/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ profilePhoto: base64Image })
                });
                
                currentUser.profilePhoto = base64Image;
                localStorage.setItem('gminsta_currentUser', JSON.stringify(currentUser));
            }
            window.location.href = '/';
        });

        function skip() {
            window.location.href = '/';
        }
    </script>
</body>

</html>
