detection:
  audio_monitoring:
    enabled: true
    energy_threshold: 0.001
    sample_rate: 16000
    whisper_enabled: false
    whisper_model: tiny.en
    zcr_threshold: 0.35
  eyes:
    blink_threshold: 0.3
    consecutive_frames: 3
    enabled: true
    gaze_sensitivity: 15
    gaze_threshold: 2
  face:
    detection_interval: 5
    min_confidence: 0.8
  mouth:
    enabled: true
    movement_threshold: 3
  multi_face:
    alert_threshold: 5
  objects:
    detection_interval: 5
    enabled: true
    max_fps: 5
    min_confidence: 0.65
enable_webcam: true
force_fullscreen: true
global:
  output_path: ./reports
lockdown_browser: true
logging:
  alert_cooldown: 10
  alert_system:
    alert_volume: 0.8
    cooldown: 10
    voice_alerts: true
  log_path: ./logs
mongodb:
  database: exam_cheating_detection
  uri: mongodb://localhost:27017/
reporting:
  image_dir: ./reports/generated/images
  output_dir: ./reports/generated
  severity_levels:
    AUDIO_DETECTED: 3
    FACE_DISAPPEARED: 1
    GAZE_AWAY: 2
    MOUTH_MOVING: 3
    MULTIPLE_FACES: 4
    OBJECT_DETECTED: 5
  wkhtmltopdf_path: C:/Program Files/wkhtmltopdf/bin/wkhtmltopdf.exe
screen:
  fps: 15
  monitor_index: 0
  recording: true
session_cleanup: true
upload_gridfs: true
video:
  fps: 30
  recording_path: ./recordings
  resolution:
  - 640
  - 480
  source: 0
